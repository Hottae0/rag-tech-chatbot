
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>RAG 기술 탐색 서비스</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      margin: 0;
      padding: 65px 16px;
      color: #1e293b;
    }
    main {
      max-width: 720px;
      margin: auto;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 5px 24px #00000010;
    }
    h1 { margin-bottom: 10px; }
    p { color: #64748b; line-height: 1.6; }
    textarea {
      display: block;
      width: 100%;
      height: 120px;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      resize: vertical;
    }
    button {
      margin-top: 16px;
      background: #2563eb;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.7;
      min-height: 60px;
    }
    small { color: #64748b; }
  </style>
</head>
<body>
  <main>
    <h1>RAG 기술 탐색 서비스</h1>
    <p>
      논문 및 특허를 활용하여 기업의 기술적 문제
      해결을 지원하는 챗봇 서비스입니다.
    </p>
    <small>현재 버전: AWS 환경 연결 테스트</small>

    <h3>기술 관련 질문</h3>

    <textarea
      id="question"
      maxlength="500"
      placeholder="예: 배터리 수명을 개선하는 기술은?">
    </textarea>

    <button id="sendButton" onclick="sendQuestion()">
      질문하기
    </button>

    <div id="result" role="status">
      질문을 입력하면 결과가 여기에 표시됩니다.
    </div>
  </main>

  <script>
    // API Gateway에서 복사한 실제 Invoke URL
    const API_URL = "https://0aqs74oo4m.execute-api.ap-northeast-2.amazonaws.com";

    async function sendQuestion() {
      const question =
        document.getElementById("question").value.trim();
      const result = document.getElementById("result");
      const button = document.getElementById("sendButton");

      if (!question) {
        result.textContent = "질문을 입력해주세요.";
        return;
      }

      button.disabled = true;
      result.textContent = "서버에 요청하는 중입니다...";

      try {
        const response = await fetch(`${API_URL}/search`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "API 요청 실패");
        }

        result.textContent = data.answer;
      } catch (error) {
        result.textContent = "오류: " + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
